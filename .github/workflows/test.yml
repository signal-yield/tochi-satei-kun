name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skills/tochi-satei-kun/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r skills/tochi-satei-kun/requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest -q

      - name: Run pipeline smoke test
        run: python skills/tochi-satei-kun/tests/test_pipeline.py
